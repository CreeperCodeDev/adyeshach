name: Build Minecraft Plugin

on:
  push:
    branches:
      - main  # 只有推送到 main 分支時才會觸發
  pull_request:
    branches:
      - main  # 在 PR 時也觸發，確保構建不會失敗

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Plugin with Gradle
        run: ./gradlew build

      - name: Find Built Jar
        run: find build/libs -name '*.jar'
